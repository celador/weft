name: Gate

on:
  push:
  pull_request:

# Least privilege: the default GITHUB_TOKEN can only read this repository. A job that needs more
# (the release workflow: id-token for npm provenance) asks for it itself.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck && pnpm -r test

  # Secret scan over the whole history (gitleaks, pinned release, checksum-verified). Findings are
  # redacted in the log. Reviewed false positives live in .gitleaks.toml; a real secret is removed
  # from the tree and rotated, never allowlisted.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --config .gitleaks.toml

  # Known-vulnerable production dependencies at high or above. A separate job so a newly published
  # advisory shows up as its own red check instead of breaking `gate`. Ignored advisories are listed
  # in package.json (pnpm.auditConfig.ignoreGhsas): extract-zip GHSA-jmr9-qjv8-65gv and
  # GHSA-7pqw-9j4j-h8q3 have no patched release; it is a Node-only dependency of
  # @cloudflare/puppeteer's browser-download path and is not in any bundle we ship.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm audit --prod --audit-level high
