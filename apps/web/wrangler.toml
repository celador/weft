# Weft web UI: static app (./public) + allow-listed API in front of weft-gateway.
# Auth (src/auth.ts): Cloudflare Access JWT when ACCESS_TEAM_DOMAIN + ACCESS_AUD are set,
# else the operator-key login (WEFT_WEB_KEY); fails closed when neither is configured.
# Setup: docs/web-ui.md.
name = "weft-web"
main = "src/index.ts"
compatibility_date = "2025-09-06"
workers_dev = false   # never expose *.workers.dev: that subdomain isn't ours to show (see AGENTS.md)
routes = [{ pattern = "weft-web.elier.ai", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first for every request so the auth gate also covers static files.
run_worker_first = true

[[services]]
binding = "GATEWAY"
service = "weft-gateway"

[[dispatch_namespaces]]
binding = "POLICY_DISPATCH"
namespace = "weft-policies"

[[analytics_engine_datasets]]
binding = "WEFT_ANALYTICS"
dataset = "weft_operations"

[vars]
ACCESS_TEAM_DOMAIN = ""   # e.g. "<team>.cloudflareaccess.com"
ACCESS_AUD = ""           # Access application AUD tag
WEFT_ALLOWED_EMAILS = ""  # optional extra allow-list, comma-separated
WEFT_EMAIL_REPO = "weft"
WEFT_EMAIL_FROM = "tasks@weft.work"

[observability]
enabled = true

# Secrets (wrangler secret put <NAME> [--env preview]):
#   WEFT_WEB_TOKEN  gateway token, scopes ["observe","human"], repos ["*"], principal = the human
#   WEFT_WEB_KEY    operator key for the fallback login (only while Access is not configured)
#   WEFT_EMAIL_TOKEN gateway token, scopes ["observe","system"], restricted to WEFT_EMAIL_REPO
#
# Optional, once apps/workflows deploys BestOfN (approve then also calls instance.sendEvent):
# [[workflows]]
# name = "weft-bestofn"
# binding = "BESTOFN"
# class_name = "BestOfN"
# script_name = "weft-workflows"

[env.preview]
name = "weft-web-preview"
workers_dev = false   # never expose *.workers.dev: that subdomain isn't ours to show (see AGENTS.md)
routes = [{ pattern = "weft-web-preview.elier.ai", custom_domain = true }]

[[env.preview.services]]
binding = "GATEWAY"
service = "weft-gateway-preview"

[[env.preview.dispatch_namespaces]]
binding = "POLICY_DISPATCH"
namespace = "weft-policies-preview"

[[env.preview.analytics_engine_datasets]]
binding = "WEFT_ANALYTICS"
dataset = "weft_operations_preview"

[env.preview.vars]
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
WEFT_ALLOWED_EMAILS = ""
WEFT_EMAIL_REPO = "weft"
WEFT_EMAIL_FROM = "tasks@weft.work"

# Public read-only demo at https://weft.elier.ai (docs/web-ui.md "Public demo"): no login,
# GET routes + live stream only, observe-only gateway token, repo allow-list, scrubbed output.
# Secrets (wrangler secret put <NAME> --env public): WEFT_PUBLIC_TOKEN (scopes ["observe"],
# repos = WEFT_PUBLIC_REPOS), WEFT_REDACT (terms scrubbed from every response).
# No WEFT_WEB_TOKEN / WEFT_WEB_KEY / WEFT_EMAIL_TOKEN here, ever.
[env.public]
name = "weft-web-public"
workers_dev = false   # never expose *.workers.dev: that subdomain isn't ours to show (see AGENTS.md)
routes = [{ pattern = "weft.elier.ai", custom_domain = true }]

[[env.public.services]]
binding = "GATEWAY"
service = "weft-gateway-preview"

[env.public.vars]
# Public site stays live; only John's weft repository may be exposed.
WEFT_PUBLIC_DEMO = "1"
WEFT_PUBLIC_REPOS = "weft"
