name = "weft-gateway"
main = "src/index.ts"
compatibility_date = "2025-09-06"
workers_dev = false   # never expose *.workers.dev: that subdomain isn't ours to show (see AGENTS.md)
routes = [{ pattern = "weft-gateway.elier.ai", custom_domain = true }]

# One RepoCoordinator per repo (THE ordered log) + one Registry (repos, tokens).
[[durable_objects.bindings]]
name = "WEFT_REPO"
class_name = "RepoCoordinator"

[[durable_objects.bindings]]
name = "WEFT_REGISTRY"
class_name = "Registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RepoCoordinator", "Registry"]

# Cross-repo index: tasks, changes (candidates), revisions, evidence, Artifacts event intake.
[[d1_databases]]
binding = "WEFT_DB"
database_name = "weft"
database_id = "d2cbb845-8748-4c45-8697-abbeb505eb95"
migrations_dir = "migrations"

# Artifacts: trunks + one fork per candidate change (needs wrangler >= 4.14x to deploy).
[[artifacts]]
binding = "ARTIFACTS"
namespace = "weft"

# Per-fork Queues event subscriptions (`pushed`) deliver here; consumer = this Worker's queue().
# Queue deleted in the 2026-10-22 post-judging wind-down; re-create it (`wrangler queues create <name>`)
# and restore this block before relying on per-fork push events again.
# [[queues.consumers]]
# queue = "weft-artifacts-events"
# max_batch_size = 10
# max_batch_timeout = 2
# max_retries = 8

# B8 workflows (script weft-workflows): pushes start ProcessRevision, /land LandChange, /select
# BestOfN, `undo` RevertOperation, `approve` signals BestOfN.
[[workflows]]
name = "weft-process-revision"
binding = "WEFT_PROCESS_REVISION"
class_name = "ProcessRevision"
script_name = "weft-workflows"

[[workflows]]
name = "weft-land-change"
binding = "WEFT_LAND_CHANGE"
class_name = "LandChange"
script_name = "weft-workflows"

[[workflows]]
name = "weft-revert-operation"
binding = "WEFT_REVERT_OPERATION"
class_name = "RevertOperation"
script_name = "weft-workflows"

[[workflows]]
name = "weft-best-of-n"
binding = "WEFT_BEST_OF_N"
class_name = "BestOfN"
script_name = "weft-workflows"

[vars]
WEFT_ARTIFACTS_NAMESPACE = "weft"
WEFT_CF_ACCOUNT_ID = "2d659dee148763a8d64c80135da7165d"
WEFT_EVENTS_QUEUE_ID = "a8419287d5f34deaa49e8ba10250c2c2"

[observability]
enabled = true

# Secrets (wrangler secret put <NAME> [--env preview]):
#   WEFT_ADMIN_TOKEN   operator secret for /v1/admin
#   WEFT_CF_API_TOKEN  Cloudflare API token with Queues edit (per-fork event subscriptions);
#                      without it new candidates get subscription_status=pending (see runbook).

[env.preview]
name = "weft-gateway-preview"
workers_dev = false   # never expose *.workers.dev: that subdomain isn't ours to show (see AGENTS.md)
routes = [{ pattern = "weft-gateway-preview.elier.ai", custom_domain = true }]

[[env.preview.durable_objects.bindings]]
name = "WEFT_REPO"
class_name = "RepoCoordinator"

[[env.preview.durable_objects.bindings]]
name = "WEFT_REGISTRY"
class_name = "Registry"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["RepoCoordinator", "Registry"]

[[env.preview.d1_databases]]
binding = "WEFT_DB"
database_name = "weft-preview"
database_id = "7bd18baa-103a-4712-8dcd-5bbac18000b1"
migrations_dir = "migrations"

[[env.preview.artifacts]]
binding = "ARTIFACTS"
namespace = "weft-preview"

# Queue deleted in the 2026-10-22 post-judging wind-down; re-create it (`wrangler queues create <name>`)
# and restore this block before relying on per-fork push events again.
# [[env.preview.queues.consumers]]
# queue = "weft-artifacts-events-preview"
# max_batch_size = 10
# max_batch_timeout = 2
# max_retries = 8

[[env.preview.workflows]]
name = "weft-process-revision-preview"
binding = "WEFT_PROCESS_REVISION"
class_name = "ProcessRevision"
script_name = "weft-workflows-preview"

[[env.preview.workflows]]
name = "weft-land-change-preview"
binding = "WEFT_LAND_CHANGE"
class_name = "LandChange"
script_name = "weft-workflows-preview"

[[env.preview.workflows]]
name = "weft-revert-operation-preview"
binding = "WEFT_REVERT_OPERATION"
class_name = "RevertOperation"
script_name = "weft-workflows-preview"

[[env.preview.workflows]]
name = "weft-best-of-n-preview"
binding = "WEFT_BEST_OF_N"
class_name = "BestOfN"
script_name = "weft-workflows-preview"

[env.preview.vars]
WEFT_ARTIFACTS_NAMESPACE = "weft-preview"
WEFT_CF_ACCOUNT_ID = "2d659dee148763a8d64c80135da7165d"
WEFT_EVENTS_QUEUE_ID = "3d609144a2a5458492dc665f49ce88ee"

# Vitest only (never deployed): same bindings minus the queue consumer (miniflare allows one
# consumer per queue and the pool runs one worker per test file; tests call queue() directly)
# and minus Artifacts (tests inject a fake).
[env.test]
name = "weft-gateway-test"
routes = []   # local-only env (`pnpm dev:local`): never inherit the production custom domain

[[env.test.durable_objects.bindings]]
name = "WEFT_REPO"
class_name = "RepoCoordinator"

[[env.test.durable_objects.bindings]]
name = "WEFT_REGISTRY"
class_name = "Registry"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["RepoCoordinator", "Registry"]

[[env.test.d1_databases]]
binding = "WEFT_DB"
database_name = "weft-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.test.vars]
WEFT_ARTIFACTS_NAMESPACE = "weft-test"

# Hosted spaces for `npx weft` (docs/hosted.md): a separate Worker with its own Registry, so
# free spaces never share storage with the team gateways above. Coordinator + registry only
# (no D1, Artifacts, Queues or Workflows). Kill switch: POST /v1/admin/hosted {"mode":"off"},
# or set WEFT_HOSTED_OFF = "1" and redeploy. Secrets (--env hosted): WEFT_ADMIN_TOKEN, and
# WEFT_SIGNUP_SECRET (random; keys the daily-rotating HMAC of the network address behind the
# signup counters, see src/spaces.ts networkKey).
[env.hosted]
name = "weft-hosted"
workers_dev = false   # never expose *.workers.dev: that subdomain isn't ours to show (see AGENTS.md)
routes = [{ pattern = "weft-hosted.elier.ai", custom_domain = true }]

[[env.hosted.durable_objects.bindings]]
name = "WEFT_REPO"
class_name = "RepoCoordinator"

[[env.hosted.durable_objects.bindings]]
name = "WEFT_REGISTRY"
class_name = "Registry"

[[env.hosted.migrations]]
tag = "v1"
new_sqlite_classes = ["RepoCoordinator", "Registry"]

# Workers Rate Limiting: per space (all requests) and per network key (POST /v1/spaces).
[[env.hosted.ratelimits]]
name = "WEFT_RATE"
namespace_id = "7301"
simple = { limit = 600, period = 60 }

[[env.hosted.ratelimits]]
name = "WEFT_SIGNUP_RATE"
namespace_id = "7302"
simple = { limit = 5, period = 60 }

[env.hosted.vars]
WEFT_ARTIFACTS_NAMESPACE = "weft-hosted"
WEFT_SIGNUPS = "open"
WEFT_HOSTED_OFF = "0"
WEFT_SIGNUPS_PER_IP_DAY = "20"
WEFT_SIGNUPS_PER_DAY = "2000"
WEFT_MAX_SPACES = "20000"
WEFT_SPACE_MAX_REPOS = "20"
WEFT_SPACE_MAX_TOKENS = "200"

[env.hosted.observability]
enabled = true
